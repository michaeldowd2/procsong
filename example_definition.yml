format_version: 2.0.0
# Each track is one clip group.
# Matrices use CSV-style columns + one-line row arrays for readability.
# Matrix axes are clip ids, never wav paths.
# Intra-group rows: previous clip id -> weights for possible next clip ids.
# Inter-group rows: downstream candidate id -> weights for current upstream clip ids.
# Intra diagonal 1.25: slightly more likely to play the same clip again.
tracks:
  - name: Drums
    clip_length: 20
    repeats: 3
    silence_probability: 0.2
    clips:
      - {id: d1, path: "Drums/Drums 1", weight: 0.8}
      - {id: d2, path: "Drums/Drums 2", weight: 0.8}
      - {id: d3, path: "Drums/Drums 3"}
      - {id: d4, path: "Drums/Drums 4"}
      - {id: d5, path: "Drums/Drums 5"}
      - {id: d6, path: "Drums/Drums 6"}
    intragroup_subsequent_weight_modifiers:
      columns: [d1, d2, d3, d4, d5, d6]
      rows:
        d1: [1.25, 1, 1, 1, 1, 1]
        d2: [1, 1.25, 1, 1, 1, 1]
        d3: [1, 1, 1.25, 1, 1, 1]
        d4: [1, 1, 1, 1.25, 1, 1]
        d5: [1, 1, 1, 1, 1.25, 1]
        d6: [1, 1, 1, 1, 1, 1.25]
  - name: Organ
    clip_length: 15
    repeats: 4
    silence_probability: 0.2
    clips:
      - {id: o1, path: "Organ/Organ 1"}
      - {id: o2, path: "Organ/Organ 2"}
      - {id: o3, path: "Organ/Organ 3"}
      - {id: o4, path: "Organ/Organ 4"}
      - {id: o5, path: "Organ/Organ 5"}
      - {id: o6, path: "Organ/Organ 6"}
      - {id: o7, path: "Organ/Organ 7"}
      - {id: o8, path: "Organ/Organ 8"}
    intragroup_subsequent_weight_modifiers:
      columns: [o1, o2, o3, o4, o5, o6, o7, o8]
      rows:
        o1: [1.25, 1, 1, 1, 1, 1, 1, 1]
        o2: [1, 1.25, 1, 1, 1, 1, 1, 1]
        o3: [1, 1, 1.25, 1, 1, 1, 1, 1]
        o4: [1, 1, 1, 1.25, 1, 1, 1, 1]
        o5: [1, 1, 1, 1, 1.25, 1, 1, 1]
        o6: [1, 1, 1, 1, 1, 1.25, 1, 1]
        o7: [1, 1, 1, 1, 1, 1, 1.25, 1]
        o8: [1, 1, 1, 1, 1, 1, 1, 1.25]
    intergroup_consecutive_weight_modifiers:
      columns: [d1, d2, d3, d4, d5, d6]
      rows:
        o1: [1, 1, 1, 1, 1, 1]
        o2: [1, 1, 1, 1, 1, 1]
        o3: [1, 1, 1, 1, 1, 1]
        o4: [1, 1, 1, 1, 1, 1]
        o5: [0, 0, 1, 1, 1, 1]
        o6: [0, 0, 1, 1, 1, 1]
        o7: [0, 0, 1, 1, 1, 1]
        o8: [0, 0, 1, 1, 1, 1]
  - name: Bass
    clip_length: 20
    repeats: 3
    silence_probability: 0.1
    clips:
      - {id: b1, path: "Bass/Bass 1"}
      - {id: b2, path: "Bass/Bass 2"}
      - {id: b3, path: "Bass/Bass 3"}
      - {id: b4, path: "Bass/Bass 4"}
      - {id: b5, path: "Bass/Bass 5"}
    intragroup_subsequent_weight_modifiers:
      columns: [b1, b2, b3, b4, b5]
      rows:
        b1: [1.25, 1, 1, 1, 1]
        b2: [1, 1.25, 1, 1, 1]
        b3: [1, 1, 1.25, 1, 1]
        b4: [1, 1, 1, 1.25, 1]
        b5: [1, 1, 1, 1, 1.25]
    intergroup_consecutive_weight_modifiers:
      columns: [o1, o2, o3, o4, o5, o6, o7, o8]
      rows:
        b1: [1, 1, 1, 1, 0, 0, 0, 0]
        b2: [1, 1, 1, 1, 0, 0, 0, 0]
        b3: [1, 1, 1, 1, 0, 0, 0, 0]
        b4: [1, 1, 1, 1, 0, 0, 0, 0]
        b5: [0, 0, 0, 0, 1, 1, 1, 1]
  - name: Lead
    clip_length: 20
    repeats: 3
    silence_probability: 0.3
    clips:
      - {id: l1, path: "Lead/Mellotron 1"}
      - {id: l2, path: "Lead/Mellotron 2"}
      - {id: l3, path: "Lead/Mellotron 3"}
      - {id: l4, path: "Lead/Mellotron 4"}
      - {id: l5, path: "Lead/Mellotron 5"}
      - {id: l6, path: "Lead/Mellotron 6"}
    intragroup_subsequent_weight_modifiers:
      columns: [l1, l2, l3, l4, l5, l6]
      rows:
        l1: [1.25, 1, 1, 1, 1, 1]
        l2: [1, 1.25, 1, 1, 1, 1]
        l3: [1, 1, 1.25, 1, 1, 1]
        l4: [1, 1, 1, 1.25, 1, 1]
        l5: [1, 1, 1, 1, 1.25, 1]
        l6: [1, 1, 1, 1, 1, 1.25]
    intergroup_consecutive_weight_modifiers:
      columns: [o1, o2, o3, o4, o5, o6, o7, o8]
      rows:
        l1: [1, 1, 1, 1, 0, 0, 0, 0]
        l2: [1, 1, 1, 1, 0, 0, 0, 0]
        l3: [1, 1, 1, 1, 0, 0, 0, 0]
        l4: [1, 1, 1, 1, 0, 0, 0, 0]
        l5: [0, 0, 0, 0, 1, 1, 1, 1]
        l6: [0, 0, 0, 0, 1, 1, 1, 1]
  - name: Percussion
    clip_length: 20
    repeats: 3
    silence_probability: 0.25
    clips:
      - {id: p1, path: "Percussion/Percussion 1"}
      - {id: p2, path: "Percussion/Percussion 2"}
      - {id: p3, path: "Percussion/Percussion 3"}
      - {id: p4, path: "Percussion/Percussion 4"}
    intragroup_subsequent_weight_modifiers:
      columns: [p1, p2, p3, p4]
      rows:
        p1: [1.25, 1, 1, 1]
        p2: [1, 1.25, 1, 1]
        p3: [1, 1, 1.25, 1]
        p4: [1, 1, 1, 1.25]
    intergroup_consecutive_weight_modifiers:
      columns: [o1, o2, o3, o4, o5, o6, o7, o8]
      rows:
        p1: [1, 1, 1, 1, 0, 0, 0, 0]
        p2: [1, 1, 1, 1, 0, 0, 0, 0]
        p3: [0, 0, 0, 0, 1, 1, 1, 1]
        p4: [0, 0, 0, 0, 1, 1, 1, 1]
