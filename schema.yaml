$schema: "http://json-schema.org/draft-07/schema#"
title: "Procedural Song Definition Schema"
description: "Schema for clip-based deterministic infinite music generation song definition YAML files."
type: object
additionalProperties:
  $ref: "#/definitions/Track"

definitions:
  Track:
    type: object
    required:
      - type
      - parts
    properties:
      type:
        type: string
        enum:
          - primary
          - secondary
          - standard
        description: "Type of the track (primary, secondary, or standard)."
      probability_silence:
        type: number
        minimum: 0
        maximum: 1
        description: "After a part is chosen, probability that this track is muted for the cycle. Mute does not clear the chosen part; dependents still see it."
      part_duration:
        type: number
        minimum: 0
        description: "Start-to-start interval in seconds. The audio file is typically longer; play the full file and start the next clip at this interval so tails overlap."
      repeats:
        type: integer
        minimum: 1
        description: "Number of starts of the same chosen part (and mute flag) before the track is evaluated again."
      parts:
        type: array
        description: "List of audio parts belonging to this track."
        items:
          $ref: "#/definitions/Part"
    allOf:
      - if:
          properties:
            type:
              const: primary
        then:
          properties:
            parts:
              items:
                not:
                  required:
                    - allowed_primary_parts
      - if:
          properties:
            type:
              const: secondary
        then:
          properties:
            parts:
              items:
                not:
                  required:
                    - allowed_secondary_parts

  Part:
    description: "A part entry, which can be a simple string or an object specifying options."
    oneOf:
      - type: string
      - type: object
        properties:
          weight:
            type: number
            minimum: 0
            description: "Optional selection weight for the part."
          allowed_primary_parts:
            type: array
            items:
              type: string
            description: "Primary parts this clip may pair with. Matching uses the primary track's chosen part, including when that track is muted."
          allowed_secondary_parts:
            type: array
            items:
              type: string
            description: "Secondary parts this clip may pair with. Matching uses the secondary track's chosen part, including when that track is muted."
