$schema: "http://json-schema.org/draft-07/schema#"
$id: "https://procsong/schema/2.0.0"
title: "Procedural Song Definition Schema v2.0.0"
description: >-
  Schema for deterministic clip-based procedural songs using two matrix concepts:
  intragroup_subsequent_weight_modifiers and intergroup_consecutive_weight_modifiers.
type: object
additionalProperties: false
required: [format_version, tracks]
properties:
  format_version:
    const: "2.0.0"
  tracks:
    type: array
    minItems: 1
    items:
      $ref: "#/definitions/Track"

definitions:
  Weight:
    type: number
    minimum: 0

  ClipId:
    type: string
    minLength: 1
    pattern: "^[A-Za-z0-9_.-]+$"
    description: >-
      Clip identifier unique across the whole definition. Used as matrix column
      headers and row keys. Not a file path.

  TrackName:
    type: string
    minLength: 1
    pattern: "^[^/]+$"

  Clip:
    type: object
    additionalProperties: false
    required: [id, path]
    properties:
      id:
        $ref: "#/definitions/ClipId"
      path:
        type: string
        minLength: 1
        description: >-
          Audio package path/string. Used only for file lookup and ChosenClip.
          Must not appear as a matrix column or row key.
      weight:
        allOf:
          - $ref: "#/definitions/Weight"
        default: 1
        description: "Base selection weight before matrix modifiers."

  IntragroupMatrix:
    type: object
    additionalProperties: false
    required: [columns, rows]
    description: >-
      Same-group transition matrix. columns lists possible next clip ids. rows maps
      each previous/source clip id to a same-length array of weight modifiers.
      Axes are clip ids, never path values.
    properties:
      columns:
        type: array
        minItems: 1
        uniqueItems: true
        items:
          $ref: "#/definitions/ClipId"
      rows:
        type: object
        minProperties: 1
        propertyNames:
          $ref: "#/definitions/ClipId"
        additionalProperties:
          type: array
          minItems: 1
          items:
            $ref: "#/definitions/Weight"

  IntergroupMatrix:
    type: object
    additionalProperties: false
    required: [columns, rows]
    description: >-
      Cross-group context matrix. columns lists upstream clip ids currently
      selected in earlier tracks. rows maps each downstream candidate clip id
      to a same-length array of weight modifiers. Axes are clip ids, never
      path values or TrackName/clip_id strings.
    properties:
      columns:
        type: array
        minItems: 1
        uniqueItems: true
        items:
          $ref: "#/definitions/ClipId"
      rows:
        type: object
        minProperties: 1
        propertyNames:
          $ref: "#/definitions/ClipId"
        additionalProperties:
          type: array
          minItems: 1
          items:
            $ref: "#/definitions/Weight"

  Track:
    type: object
    additionalProperties: false
    required: [name, clip_length, repeats, clips]
    properties:
      name:
        $ref: "#/definitions/TrackName"
      clip_length:
        type: number
        minimum: 0
        description: >-
          Start-to-start interval in seconds; converted to an integer >= 1 by
          AtLeastOne. This is not the audio-file duration.
      repeats:
        type: integer
        minimum: 1
      silence_probability:
        type: number
        minimum: 0
        maximum: 1
        default: 0
      clips:
        type: array
        minItems: 1
        description: "Candidate clips in deterministic weighted-selection order."
        items:
          $ref: "#/definitions/Clip"
      intragroup_subsequent_weight_modifiers:
        $ref: "#/definitions/IntragroupMatrix"
      intergroup_consecutive_weight_modifiers:
        $ref: "#/definitions/IntergroupMatrix"
