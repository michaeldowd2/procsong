$schema: "http://json-schema.org/draft-07/schema#"
title: "Procedural Song Definition Schema"
description: "Schema for clip-based deterministic infinite music generation song definition YAML files."
type: object
additionalProperties:
  $ref: "#/definitions/Track"

definitions:
  Track:
    type: object
    required:
      - type
      - parts
    properties:
      type:
        type: string
        enum:
          - primary
          - secondary
          - standard
        description: "primary = always eligible (e.g. drums). secondary = filtered by current primary ChosenPart. standard = filtered by current primary and/or secondary ChosenPart. Sequencer order at a shared second is primary, then secondary, then standard (YAML order within type). See SPECIFICATION.md."
      probability_silence:
        type: number
        minimum: 0
        maximum: 1
        description: "After a part is chosen, P(this start is muted) for the whole evaluation cycle. Mute is volume only; ChosenPart stays set and dependents still see it. Compare with R_silence using strict < . Default 0."
      part_duration:
        type: number
        minimum: 0
        description: "Start-to-start interval in seconds, rounded to an integer ≥ 1. Independent per track; not a shared bar. The audio file is typically longer — play the full file and start the next clip at this interval so tails overlap."
      repeats:
        type: integer
        minimum: 1
        description: "Number of starts (including the evaluating start) of the same ChosenPart and mute flag before this track evaluates again. Retriggers do not consume PRNG draws."
      parts:
        type: array
        description: "List of audio parts belonging to this track."
        items:
          $ref: "#/definitions/Part"
    allOf:
      - if:
          properties:
            type:
              const: primary
        then:
          properties:
            parts:
              items:
                not:
                  required:
                    - allowed_primary_parts
      - if:
          properties:
            type:
              const: secondary
        then:
          properties:
            parts:
              items:
                not:
                  required:
                    - allowed_secondary_parts

  Part:
    description: "A part entry, which can be a simple string or an object specifying options."
    oneOf:
      - type: string
      - type: object
        properties:
          weight:
            type: number
            minimum: 0
            description: "Optional selection weight for the part."
          allowed_primary_parts:
            type: array
            items:
              type: string
            description: "If omitted, no primary restriction. If present, at least one current primary ChosenPart must be in this list (exact YAML path). Mute on the primary does not matter. Empty list matches nothing."
          allowed_secondary_parts:
            type: array
            items:
              type: string
            description: "If omitted, no secondary restriction. If present, at least one current secondary ChosenPart must be in this list (exact YAML path). Mute on the secondary does not matter. Empty list matches nothing."
